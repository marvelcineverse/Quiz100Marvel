<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Joueur · Quiz du Multivers</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/joueur.js"></script>
</head>
<body class="page-jeu">
  <main id="ecran-rejoindre" class="centre" hidden>
    <form id="form-rejoindre" class="carte carte-etroite">
      <h1 class="logo">Quiz du <span>Multivers</span></h1>
      <p class="discret">Espace joueur</p>
      <label>Code de la partie
        <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" required autofocus class="code-saisie">
      </label>
      <label>Ton nom
        <input id="nom" maxlength="20" autocomplete="nickname" required>
      </label>
      <button class="btn btn-principal" type="submit">Rejoindre</button>
      <p id="erreur-rejoindre" class="erreur" hidden></p>
    </form>
  </main>

  <div id="ecran-jeu" hidden>
    <header class="bandeau">
      <div>
        <div id="moi-nom" class="bandeau-nom"></div>
        <div id="moi-rang" class="discret"></div>
      </div>
      <div class="bandeau-score"><b id="moi-score">0</b><span>pts</span></div>
      <span id="voyant" class="voyant"></span>
    </header>
    <main id="zone" class="zone-jeu"></main>
  </div>
</body>
</html>
